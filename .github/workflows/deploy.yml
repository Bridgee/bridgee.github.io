name: Deploy to GitHub Pages

on:
  push:
    branches: [main]        # change if your default branch is different
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v2
